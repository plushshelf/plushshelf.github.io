<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>管理 · 公仔架</title>
<link rel="stylesheet" href="../assets/catalog.css">
<style>
  .wrap { max-width:640px; margin:0 auto; padding:36px 22px; }
  a.brand { display:block; margin-top:18px; padding:18px; background:var(--card); border:1px solid var(--line); border-radius:16px; text-decoration:none; color:inherit; }
  a.brand b { display:block; font-size:20px; font-weight:500; }
  a.brand span { color:var(--muted); font-size:13px; font-family:"PingFang TC", sans-serif; }
  label { display:grid; gap:6px; margin-top:18px; color:var(--muted); font-size:13px; font-family:"PingFang TC", sans-serif; }
  #msg { color:var(--muted); min-height:1.2em; font-family:"PingFang TC", sans-serif; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>管理</h1>
  <p id="msg">驗證中…</p>
  <form id="gate" class="hidden">
    <label>GitHub token<input id="token" type="password" autocomplete="off" spellcheck="false"></label>
    <button class="primary" type="submit">驗證</button>
  </form>
  <div id="list" class="hidden"></div>
  <p><a class="back" href="../">返回公仔架</a></p>
</div>
<script src="../assets/cms-home.js"></script>
</body>
</html>
