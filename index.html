<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jellycat 公仔清單</title>
<style>
  :root { --bg:#f6f1ea; --ink:#2c241c; --muted:#7a6d62; --card:#fffdf9; --line:#e6dcd0; --hold:#c47b2b; --sold:#8a8178; --ok:#3d6b4f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Palatino, "Songti TC", serif; background:var(--bg); color:var(--ink); }
  header, .bar, .stats, .grid, .foot { max-width:1180px; margin:0 auto; padding-left:22px; padding-right:22px; }
  header { padding-top:28px; }
  h1 { font-weight:500; font-size:32px; margin:0 0 6px; }
  .sub, .bar, .stats, .body, .foot, form { font-family: "PingFang TC", sans-serif; }
  .sub { color:var(--muted); font-size:14px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin:18px auto; }
  #stats { display:none; }
  body.manage.authed #stats { display:flex; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-width:96px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--muted); font-size:12px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; position:sticky; top:0; z-index:30; background:rgba(246,241,234,.94); backdrop-filter:blur(10px); padding-top:10px; padding-bottom:10px; }
  .chips { display:none; width:100%; gap:6px; overflow-x:auto; }
  .chips button { flex:0 0 auto; border-radius:999px; padding:6px 12px; font-size:13px; }
  .chips button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  @media (max-width: 760px) {
    .narrow-hide { display:none !important; }
    .chips { display:flex; }
  }
  input, select, textarea, button { font:inherit; }
  input[type="search"], select { background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px; color:var(--ink); }
  button { border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.danger { color:#8d3b32; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; padding-bottom:40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .card.sold { opacity:1; }
  .card.hold { outline:2px solid #efd3b4; }
  .photos { display:grid; background:#efe7dc; min-height:180px; position:relative; }
  .photos.two { grid-template-columns:1fr 1fr; }
  .photos img { width:100%; height:280px; object-fit:cover; display:block; background:#efe7dc; }
  .card.sold .photos::before { content:""; position:absolute; inset:0; background:rgba(255,253,249,.3); pointer-events:none; }
  .card.sold .photos::after { content:"已售"; position:absolute; left:0; right:0; bottom:18px; text-align:center; font-family:Palatino, "Songti TC", serif; font-size:22px; letter-spacing:.4em; color:rgba(90,82,74,.72); pointer-events:none; }
  .body { padding:16px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .name { font-size:21px; line-height:1.25; margin:0; }
  .price { font-size:16px; letter-spacing:.01em; }
  .meta { color:var(--muted); font-size:12px; line-height:1.45; }
  .empty { padding:28px 0; color:var(--muted); }
  .badges, .actions { display:flex; gap:6px; flex-wrap:wrap; }
  .badge { font-size:11px; border-radius:999px; padding:2px 8px; background:#eef5ef; color:var(--ok); }
  .badge.hold { background:#fff1e2; color:var(--hold); }
  .badge.sold { background:#eeeae6; color:var(--sold); }
  .actions { margin-top:auto; padding-top:8px; }
  .actions button { font-size:12px; padding:6px 8px; }
  .gate, .auth-only { display:none; }
  body.manage .gate { display:inline-flex; }
  body.manage.authed .auth-only { display:inline-flex; }
  #token { min-width: 200px; }
  #syncStatus { color: var(--muted); font-size: 13px; align-items: center; }
  .photos button.shot { display:block; width:100%; margin:0; padding:0; border:0; border-radius:0; background:#efe7dc; cursor:zoom-in; }
  .photos button.shot img { width:100%; height:280px; object-fit:cover; display:block; }
  #lightbox[hidden] { display:none !important; }
  #lightbox { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:18px; }
  .lb-backdrop { position:absolute; inset:0; background:rgba(44,36,28,.55); backdrop-filter:blur(8px); }
  .lb-frame { position:relative; z-index:1; width:min(880px, 100%); background:#fffdf9; border-radius:22px; padding:16px 16px 14px; box-shadow:0 28px 70px rgba(44,36,28,.28); }
  .lb-x { position:absolute; top:10px; right:10px; z-index:2; border-radius:999px; background:rgba(255,253,249,.94); }
  #lbImg { width:100%; max-height:72vh; object-fit:contain; background:#efe7dc; border-radius:14px; display:block; }
  .lb-nav { position:absolute; top:42%; width:42px; height:42px; border-radius:999px; background:#fffdf9; font-size:24px; line-height:1; padding:0; }
  .lb-nav.prev { left:22px; }
  .lb-nav.next { right:22px; }
  .lb-cap { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; padding:10px 4px 0; font-family:"PingFang TC", sans-serif; }
  .lb-cap strong { font-size:18px; font-family:Palatino, "Songti TC", serif; font-weight:500; }
  .lb-cap span, #lbCount { color:var(--muted); font-size:13px; }
  #lbCount { color:var(--ink); letter-spacing:.04em; }
  dialog { border:0; border-radius:16px; padding:0; width:min(560px, calc(100% - 24px)); }
  dialog::backdrop { background:rgba(44,36,28,.35); }
  form { padding:18px; display:grid; gap:8px; }
  label { display:grid; gap:4px; font-size:12px; color:var(--muted); }
  label input, label textarea { color:var(--ink); font-size:14px; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .checks { display:flex; gap:14px; color:var(--ink); }
  .checks label { display:flex; align-items:center; gap:6px; }
  .form-actions { display:flex; justify-content:space-between; }
  .foot { color:var(--muted); font-size:12px; padding-bottom:28px; }
</style>
</head>
<body>
<header>
  <h1>Jellycat 公仔清單</h1>
  <div class="sub">共 <span id="count">0</span> 件</div>
</header>
<div class="stats" id="stats"></div>
<div class="bar">
  <input id="q" type="search" placeholder="搜尋品名、系列、顏色、編號">
  <select id="series"></select>
  <select id="status" class="narrow-hide">
    <option value="all">全部狀態</option>
    <option value="available" selected>可售</option>
    <option value="hold">Hold</option>
    <option value="sold">Sold</option>
  </select>
  <select id="size" class="narrow-hide">
    <option value="">全部尺寸</option>
    <option>匙扣</option>
    <option>小型</option>
    <option>中型</option>
  </select>
  <div class="chips" id="statusChips" data-target="status">
    <button type="button" data-value="all">全部</button>
    <button type="button" data-value="available" class="on">可售</button>
    <button type="button" data-value="hold">Hold</button>
    <button type="button" data-value="sold">Sold</button>
  </div>
  <div class="chips" id="sizeChips" data-target="size">
    <button type="button" data-value="">全部尺寸</button>
    <button type="button" data-value="匙扣">匙扣</button>
    <button type="button" data-value="小型">小型</button>
    <button type="button" data-value="中型">中型</button>
  </div>
  <button id="toggleManage" type="button">管理</button>
  <input class="gate" id="token" type="password" placeholder="GitHub token" autocomplete="off" spellcheck="false">
  <button class="gate" id="verifyBtn" type="button">驗證</button>
  <span class="gate" id="syncStatus"></span>
  <br>
  <button class="auth-only primary" id="addBtn" type="button">新增</button>
  <button class="auth-only primary" id="pushBtn" type="button">儲存到 GitHub</button>
  <button class="auth-only" id="exportJson" type="button">匯出 JSON</button>
  <button class="auth-only" id="importJson" type="button">匯入 JSON</button>
  <button class="auth-only danger" id="resetBtn" type="button">還原已發布</button>
  <input id="file" type="file" accept="application/json" hidden>
</div>
<div class="grid" id="grid"><div class="empty">載入中…</div></div>
<p class="foot">Copyright © <span id="year"></span> WingA. All rights reserved.</p>
<dialog id="dlg">
  <form id="form">
    <h2 id="dlgTitle">編輯</h2>
    <label>繁體中文品名<input name="name" required></label>
    <div class="row2">
      <label>編號<input name="id" type="number" required></label>
      <label>Price @1<input name="price" type="number" min="0" step="1"></label>
    </div>
    <div class="row2">
      <label>系列／類型<input name="series" list="seriesList"></label>
      <label>尺寸感覺<input name="size" list="sizeList"></label>
    </div>
    <datalist id="seriesList"></datalist>
    <datalist id="sizeList"><option value="匙扣"><option value="小型"><option value="中型"></datalist>
    <label>顏色／特徵<input name="color"></label>
    <label>備註<textarea name="note" rows="2"></textarea></label>
    <label>參考連結文字<input name="linkLabel" value="參考連結"></label>
    <label>參考連結網址<input name="linkUrl"></label>
    <label>圖片檔名<input name="imageName"></label>
    <label>圖片 Google Drive 連結<input name="imageUrl"></label>
    <label>另一角度檔名<input name="image2Name"></label>
    <label>另一角度連結<input name="image2Url"></label>
    <div class="checks">
      <label><input type="checkbox" name="hold"> Hold</label>
      <label><input type="checkbox" name="sold"> Sold</label>
    </div>
    <div class="form-actions">
      <button type="button" class="danger" id="delBtn">刪除</button>
      <span>
        <button type="button" id="cancelBtn">取消</button>
        <button class="primary" type="submit">套用</button>
      </span>
    </div>
  </form>
</dialog>
<div id="lightbox" hidden>
  <div class="lb-backdrop" id="lbBackdrop"></div>
  <div class="lb-frame">
    <button type="button" class="lb-x" id="lbClose">關閉</button>
    <button type="button" class="lb-nav prev" id="lbPrev" aria-label="上一張">‹</button>
    <img id="lbImg" alt="">
    <button type="button" class="lb-nav next" id="lbNext" aria-label="下一張">›</button>
    <div class="lb-cap"><strong id="lbName"></strong><span id="lbCount"></span><span id="lbMeta"></span></div>
  </div>
</div>
<script>
document.getElementById("year").textContent = String(new Date().getFullYear());
const GH = { owner: "wingac", repo: "crawl_result_page", branch: "main", path: "data.json" };
const DRAFT = "jellycat-draft-v2";
const TOKEN = "jellycat-gh-token";
let items = [];
let editing = null;
let dirty = false;
let ready = false;
function syncChips() {
  document.querySelectorAll(".chips").forEach(function (row) {
    const target = document.getElementById(row.dataset.target);
    if (!target) return;
    row.querySelectorAll("button").forEach(function (btn) {
      btn.classList.toggle("on", btn.dataset.value === target.value);
    });
  });
}

function setStatus(text) {
  const el = document.getElementById("syncStatus");
  if (el) el.textContent = text || "";
}
function driveId(url) {
  if (!url) return "";
  const m = String(url).match(/\/d\/([^/]+)/) || String(url).match(/[?&]id=([^&]+)/);
  return m ? m[1] : "";
}
function thumb(url, size) {
  const id = driveId(url);
  return id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + (size || 800) : "";
}
function money(n) { return n === "" || n == null ? "—" : "HK$" + Number(n).toLocaleString("en-HK"); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function byId(id) { return items.filter(function (i) { return String(i.id) === String(id); })[0]; }
function markDirty() {
  dirty = true;
  localStorage.setItem(DRAFT, JSON.stringify(items));
  setStatus("有尚未上傳的修改");
}
function render() {
  if (!ready) return;
  const q = document.getElementById("q").value.trim().toLowerCase();
  const series = document.getElementById("series").value;
  const status = document.getElementById("status").value;
  const size = document.getElementById("size").value;
  const seriesSet = [];
  items.forEach(function (i) { if (i.series && seriesSet.indexOf(i.series) < 0) seriesSet.push(i.series); });
  seriesSet.sort();
  const sel = document.getElementById("series");
  sel.innerHTML = "<option value=\"\">全部系列</option>" + seriesSet.map(function (s) { return "<option>" + esc(s) + "</option>"; }).join("");
  if (seriesSet.indexOf(series) >= 0) sel.value = series;
  document.getElementById("seriesList").innerHTML = seriesSet.map(function (s) { return "<option value=\"" + esc(s) + "\">"; }).join("");
  const shown = items.filter(function (i) {
    const blob = [i.id, i.name, i.series, i.color, i.note, i.linkLabel, i.size].join(" ").toLowerCase();
    if (q && blob.indexOf(q) < 0) return false;
    if (sel.value && i.series !== sel.value) return false;
    if (size && i.size !== size) return false;
    if (status === "sold" && !i.sold) return false;
    if (status === "hold" && !(i.hold && !i.sold)) return false;
    if (status === "available" && (i.hold || i.sold)) return false;
    return true;
  }).sort(function (a, b) { return a.id - b.id; });
  function sum(list) { return list.reduce(function (n, i) { return n + (Number(i.price) || 0); }, 0); }
  const available = items.filter(function (i) { return !i.hold && !i.sold; });
  const holds = items.filter(function (i) { return i.hold && !i.sold; });
  const solds = items.filter(function (i) { return i.sold; });
  document.getElementById("count").textContent = String(items.length);
  document.getElementById("stats").innerHTML = [
    ["全部", items.length, sum(items)],
    ["可售", available.length, sum(available)],
    ["Hold", holds.length, sum(holds)],
    ["Sold", solds.length, sum(solds)],
    ["顯示中", shown.length, sum(shown)]
  ].map(function (row) {
    const showMoney = document.body.classList.contains("manage") && document.body.classList.contains("authed");
    return "<div class=\"stat\"><b>" + row[1] + "</b><span>" + row[0] + (showMoney ? " · " + money(row[2]) : "") + "</span></div>";
  }).join("");
  syncChips();
  const grid = document.getElementById("grid");
  if (!shown.length) { grid.innerHTML = "<div class=\"empty\">沒有符合的項目</div>"; return; }
  grid.innerHTML = shown.map(function (i) {
    const photos = [i.imageUrl, i.image2Url].filter(Boolean);
    const cls = "card" + (i.sold ? " sold" : "") + (i.hold && !i.sold ? " hold" : "");
    const badge = i.sold ? "<span class=\"badge sold\">Sold</span>" : i.hold ? "<span class=\"badge hold\">Hold</span>" : "<span class=\"badge\">可售</span>";
    const imgs = photos.map(function (u, idx) {
      return "<button type=\"button\" class=\"shot\" data-act=\"view\" data-id=\"" + i.id + "\" data-idx=\"" + idx + "\"><img alt=\"" + esc(i.name) + "\" src=\"" + esc(thumb(u)) + "\"></button>";
    }).join("");
    const link = i.linkUrl ? "<a href=\"" + esc(i.linkUrl) + "\" target=\"_blank\" rel=\"noopener\">" + esc("參考連結") + "</a>" : esc(i.linkLabel || "");
    return "<article class=\"" + cls + "\"><div class=\"photos" + (photos.length > 1 ? " two" : "") + "\">" + imgs + "</div><div class=\"body\"><div class=\"badges\">" + badge + "<span class=\"badge\">" + esc(i.series || "未分類") + "</span><span class=\"badge\">" + esc(i.size || "") + "</span></div><h2 class=\"name\">" + esc(i.name) + "</h2><div class=\"price\">" + money(i.price) + " · #" + esc(i.id) + "</div><div class=\"meta\">" + esc(i.color || "") + (i.note ? " · " + esc(i.note) : "") + "</div><div class=\"meta\">" + link + "</div><div class=\"actions\"><button class=\"auth-only\" data-act=\"hold\" data-id=\"" + i.id + "\">" + (i.hold ? "取消 Hold" : "Hold") + "</button><button class=\"auth-only\" data-act=\"sold\" data-id=\"" + i.id + "\">" + (i.sold ? "取消 Sold" : "Sold") + "</button><button class=\"auth-only\" data-act=\"edit\" data-id=\"" + i.id + "\">編輯</button></div></div></article>";
  }).join("");
}
function tokenValue() { return document.getElementById("token").value.trim(); }
function ghHeaders(token) {
  return {
    Accept: "application/vnd.github+json",
    Authorization: "Bearer " + token,
    "X-GitHub-Api-Version": "2022-11-28"
  };
}
function b64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
async function pushGithub() {
  const token = tokenValue();
  if (!token) { alert("請先貼上 GitHub token"); return; }
  localStorage.setItem(TOKEN, token);
  const btn = document.getElementById("pushBtn");
  btn.disabled = true;
  setStatus("上傳中…");
  try {
    const api = "https://api.github.com/repos/" + GH.owner + "/" + GH.repo + "/contents/" + GH.path;
    const headers = ghHeaders(token);
    const get = await fetch(api + "?ref=" + encodeURIComponent(GH.branch), { headers: headers, cache: "no-store" });
    let sha = "";
    if (get.status === 401 || get.status === 403) {
      setAuthed(false);
      localStorage.removeItem(TOKEN);
      const err = await get.json().catch(function () { return {}; });
      throw new Error(err.message || "token 無效或沒有權限");
    }
    if (get.ok) {
      sha = (await get.json()).sha;
    } else if (get.status !== 404) {
      const err = await get.json().catch(function () { return {}; });
      throw new Error(err.message || "讀取 data.json 失敗");
    }
    const body = {
      message: "Update listing",
      content: b64(JSON.stringify(items, null, 2) + "\n"),
      branch: GH.branch
    };
    if (sha) body.sha = sha;
    const put = await fetch(api, { method: "PUT", headers: headers, body: JSON.stringify(body) });
    if (!put.ok) {
      const err = await put.json().catch(function () { return {}; });
      throw new Error(err.message || "上傳失敗");
    }
    localStorage.removeItem(DRAFT);
    dirty = false;
    setStatus("已上傳。約一分鐘後重新整理公開頁。");
  } catch (err) {
    setStatus(err.message || "上傳失敗");
    alert(err.message || "上傳失敗");
  } finally {
    btn.disabled = false;
  }
}
async function loadPublished() {
  const res = await fetch("data.json?ts=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("讀不到 data.json");
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error("data.json 格式不正確");
  return data;
}
document.getElementById("grid").addEventListener("click", function (e) {
  const btn = e.target.closest("button");
  if (!btn) return;
  const item = byId(btn.dataset.id);
  if (!item) return;
  if (btn.dataset.act === "view") return openPreview(item, Number(btn.dataset.idx) || 0);
  if (btn.dataset.act === "hold") { item.hold = !item.hold; if (item.hold) item.sold = false; }
  if (btn.dataset.act === "sold") { item.sold = !item.sold; if (item.sold) item.hold = false; }
  if (btn.dataset.act === "edit") return openForm(item);
  markDirty(); render();
});
["q","series","status","size"].forEach(function (id) { document.getElementById(id).addEventListener("input", render); });
document.querySelectorAll(".chips").forEach(function (row) {
  row.addEventListener("click", function (e) {
    const btn = e.target.closest("button");
    if (!btn) return;
    const target = document.getElementById(row.dataset.target);
    if (!target) return;
    target.value = btn.dataset.value;
    render();
  });
});
function setAuthed(on) {
  document.body.classList.toggle("authed", !!on);
  if (items.length) render();
}
async function verifyToken() {
  const token = tokenValue();
  if (!token) {
    setAuthed(false);
    localStorage.removeItem(TOKEN);
    setStatus("請貼上 token");
    return false;
  }
  setStatus("驗證中…");
  try {
    const res = await fetch("https://api.github.com/repos/" + GH.owner + "/" + GH.repo, { headers: ghHeaders(token), cache: "no-store" });
    if (!res.ok) {
      setAuthed(false);
      localStorage.removeItem(TOKEN);
      setStatus(res.status === 401 ? "token 無效" : "token 沒有這個 repo 的權限");
      return false;
    }
    const repo = await res.json();
    if (!repo.permissions || !repo.permissions.push) {
      setAuthed(false);
      localStorage.removeItem(TOKEN);
      setStatus("token 沒有寫入權限");
      return false;
    }
    localStorage.setItem(TOKEN, token);
    setAuthed(true);
    setStatus(dirty ? "有尚未上傳的修改" : "已驗證");
    return true;
  } catch (err) {
    setAuthed(false);
    setStatus("驗證失敗");
    return false;
  }
}
document.getElementById("toggleManage").onclick = function () {
  const on = document.body.classList.toggle("manage");
  document.getElementById("toggleManage").textContent = on ? "離開管理" : "管理";
  if (!on) { setAuthed(false); return; }
  if (tokenValue()) verifyToken();
};
document.getElementById("token").addEventListener("input", function () { setAuthed(false); });
document.getElementById("verifyBtn").onclick = verifyToken;
document.getElementById("addBtn").onclick = function () { openForm(null); };
document.getElementById("cancelBtn").onclick = function () { document.getElementById("dlg").close(); };
document.getElementById("delBtn").onclick = function () {
  if (!editing) return;
  if (!confirm("刪除這件？")) return;
  items = items.filter(function (i) { return i !== editing; });
  markDirty(); document.getElementById("dlg").close(); render();
};
function openForm(item) {
  editing = item;
  const f = document.getElementById("form");
  document.getElementById("dlgTitle").textContent = item ? "編輯" : "新增";
  document.getElementById("delBtn").style.visibility = item ? "visible" : "hidden";
  const maxId = items.reduce(function (n, i) { return Math.max(n, Number(i.id) || 0); }, 0);
  const blank = {id:maxId+1,name:"",price:"",series:"",size:"",color:"",note:"",linkLabel:"參考連結",linkUrl:"",imageName:"",imageUrl:"",image2Name:"",image2Url:"",hold:false,sold:false};
  const src = item || blank;
  Array.prototype.forEach.call(f.elements, function (el) {
    if (!el.name) return;
    if (el.type === "checkbox") el.checked = !!src[el.name];
    else el.value = src[el.name] == null ? "" : src[el.name];
  });
  document.getElementById("dlg").showModal();
}
document.getElementById("form").onsubmit = function (e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const obj = {
    id: Number(fd.get("id")),
    name: String(fd.get("name") || "").trim(),
    price: fd.get("price") === "" ? "" : Number(fd.get("price")),
    series: String(fd.get("series") || "").trim(),
    size: String(fd.get("size") || "").trim(),
    color: String(fd.get("color") || "").trim(),
    note: String(fd.get("note") || "").trim(),
    linkLabel: String(fd.get("linkLabel") || "").trim(),
    linkUrl: String(fd.get("linkUrl") || "").trim(),
    imageName: String(fd.get("imageName") || "").trim(),
    imageUrl: String(fd.get("imageUrl") || "").trim(),
    image2Name: String(fd.get("image2Name") || "").trim(),
    image2Url: String(fd.get("image2Url") || "").trim(),
    hold: fd.get("hold") === "on",
    sold: fd.get("sold") === "on"
  };
  if (obj.hold && obj.sold) obj.hold = false;
  if (items.some(function (i) { return i !== editing && Number(i.id) === obj.id; })) { alert("編號已存在"); return; }
  if (editing) Object.assign(editing, obj); else items.push(obj);
  markDirty(); document.getElementById("dlg").close(); render();
};
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: type || "text/plain"}));
  a.download = name; a.click();
}
document.getElementById("exportJson").onclick = function () { download("data.json", JSON.stringify(items, null, 2) + "\n", "application/json"); };
document.getElementById("importJson").onclick = function () { document.getElementById("file").click(); };
document.getElementById("file").onchange = function (e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    const data = JSON.parse(String(reader.result));
    if (!Array.isArray(data)) { alert("JSON 必須是陣列"); return; }
    items = data; markDirty(); render();
  };
  reader.readAsText(file);
  e.target.value = "";
};
let preview = null;
function previewPhotos(item) { return [item.imageUrl, item.image2Url].filter(Boolean); }
function paintPreview() {
  const item = byId(preview.id);
  if (!item) return closePreview();
  const photos = previewPhotos(item);
  if (!photos.length) return closePreview();
  if (preview.idx < 0) preview.idx = photos.length - 1;
  if (preview.idx >= photos.length) preview.idx = 0;
  const img = document.getElementById("lbImg");
  img.src = thumb(photos[preview.idx], 1600);
  img.alt = item.name;
  document.getElementById("lbName").textContent = item.name;
  document.getElementById("lbMeta").textContent = [money(item.price), item.series, item.color].filter(Boolean).join(" · ");
  const multi = photos.length > 1;
  document.getElementById("lbCount").textContent = multi ? (preview.idx + 1) + " / " + photos.length : "";
  document.getElementById("lbPrev").hidden = !multi;
  document.getElementById("lbNext").hidden = !multi;
}
function openPreview(item, idx) {
  if (!previewPhotos(item).length) return;
  preview = { id: item.id, idx: idx || 0 };
  paintPreview();
  document.getElementById("lightbox").hidden = false;
  document.body.style.overflow = "hidden";
}
function closePreview() {
  preview = null;
  document.getElementById("lightbox").hidden = true;
  document.body.style.overflow = "";
}
document.getElementById("lbClose").onclick = closePreview;
document.getElementById("lbBackdrop").onclick = closePreview;
document.getElementById("lbPrev").onclick = function () { if (!preview) return; preview.idx -= 1; paintPreview(); };
document.getElementById("lbNext").onclick = function () { if (!preview) return; preview.idx += 1; paintPreview(); };
document.addEventListener("keydown", function (e) {
  if (!preview) return;
  if (e.key === "Escape") closePreview();
  if (e.key === "ArrowLeft") { preview.idx -= 1; paintPreview(); }
  if (e.key === "ArrowRight") { preview.idx += 1; paintPreview(); }
});
document.getElementById("pushBtn").onclick = pushGithub;
document.getElementById("resetBtn").onclick = async function () {
  if (!confirm("還原成網站上已發布的 data.json？尚未上傳的修改會消失。")) return;
  try {
    items = await loadPublished();
    localStorage.removeItem(DRAFT);
    dirty = false;
    setStatus("已還原成發布版本");
    render();
  } catch (err) {
    alert(err.message || "還原失敗");
  }
};
loadPublished().then(function (data) {
  const saved = localStorage.getItem(TOKEN);
  if (saved) document.getElementById("token").value = saved;
  const draft = localStorage.getItem(DRAFT);
  if (draft) {
    try { items = JSON.parse(draft); dirty = true; setStatus("有尚未上傳的修改"); }
    catch (e) { items = data; }
  } else {
    items = data;
  }
  ready = true;
  render();
}).catch(function (err) {
  document.getElementById("grid").innerHTML = "<div class=\"empty\">" + esc(err.message || "讀不到 data.json") + "</div>";
});
</script>
</body>
</html>
