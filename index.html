<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公仔架</title>
<link rel="stylesheet" href="assets/catalog.css">
<style>
  .wrap { max-width:880px; margin:0 auto; padding:36px 22px 28px; }
  .wrap h1 { font-size:40px; }
  .wrap .sub { margin:0 0 28px; }
  a.brand { display:flex; flex-direction:column; gap:8px; min-height:180px; padding:22px; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:18px; }
  a.brand strong { font-size:28px; font-weight:500; }
  a.brand small { color:var(--muted); line-height:1.5; font-family:"PingFang TC", sans-serif; }
  .go { margin-top:auto; font-family:"PingFang TC", sans-serif; font-size:13px; }
  .admin { display:inline-block; margin-top:18px; color:var(--muted); font-size:12px; font-family:"PingFang TC", sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>公仔架</h1>
  <p class="sub">選擇品牌</p>
  <div class="grid" id="brands"><div class="empty">載入中…</div></div>
  <a class="admin" href="cms/">管理</a>
  <p class="foot">Copyright © <span id="year"></span> WingA. All rights reserved.</p>
</div>
<script src="assets/home.js"></script>
</body>
</html>
