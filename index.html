<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公仔架</title>
<style>
  :root { --bg:#f6f1ea; --ink:#2c241c; --muted:#7a6d62; --card:#fffdf9; --line:#e6dcd0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Palatino, "Songti TC", serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:880px; margin:0 auto; padding:36px 22px 28px; }
  h1 { font-weight:500; font-size:40px; margin:0 0 8px; }
  .sub, .card small, .foot, .admin { font-family:"PingFang TC", sans-serif; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
  a.card { display:flex; flex-direction:column; gap:8px; min-height:180px; padding:22px; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:18px; }
  a.card strong { font-size:28px; font-weight:500; }
  a.card small { color:var(--muted); line-height:1.5; }
  .go { margin-top:auto; font-family:"PingFang TC", sans-serif; font-size:13px; }
  .foot { color:var(--muted); font-size:12px; margin-top:36px; }
  .admin { display:inline-block; margin-top:18px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>公仔架</h1>
  <p class="sub">選擇品牌</p>
  <div class="grid">
    <a class="card" href="jellycat/">
      <strong>Jellycat</strong>
      <small>垂耳兔、趣味物、匙扣</small>
      <span class="go">進入清單</span>
    </a>
  </div>
  <a class="admin" href="cms/">管理</a>
  <p class="foot">Copyright © <span id="year"></span> WingA. All rights reserved.</p>
</div>
<script>
document.getElementById("year").textContent = String(new Date().getFullYear());
</script>
</body>
</html>
